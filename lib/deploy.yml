# .github/workflows/deploy.yml

name: Deploy to GitHub Pages

# Roda o workflow toda vez que um push é feito no branch `main`
on:
  push:
    branches: [ main ]

# Permite que a Action faça um commit no branch gh-pages
permissions:
  contents: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name:  checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build for web
        # IMPORTANTE: Substitua 'mixtape' pelo nome do seu repositório
        run: flutter build web --release --base-href /mixtape/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web